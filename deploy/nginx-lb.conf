# L7-балансировщик перед N репликами backend (docker-compose.scale.yml, loadtest/scale.sh).
# Имя backend резолвится через Docker DNS в адреса всех реплик; параметр resolve (nginx ≥ 1.27.3)
# перечитывает их на лету — реплики можно добавлять/убирать без перезапуска балансировщика.
# Round-robin по репликам, keepalive-соединения к ним. Sticky-сессии не нужны: backend stateless.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream backend_pool {
    zone backend_pool 64k;
    server backend:8080 resolve max_fails=3 fail_timeout=5s;
    keepalive 128;
}

log_format upstream '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

server {
    listen 8080;
    server_name _;
    access_log off;
    client_max_body_size 200m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_request_buffering off;
    # упавшую/перезапускаемую реплику обходим: идемпотентный запрос повторяется на соседней
    proxy_next_upstream error timeout http_502 http_503;

    # какая реплика ответила — для проверки балансировки
    add_header X-Upstream $upstream_addr always;

    location = /lb/health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://backend_pool;
    }
}
