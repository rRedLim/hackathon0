# Запуск: docker compose up -d --build   →  http://localhost:8081 (UI), http://localhost:8080 (API)
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: tram-forecast-backend:1.0
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      APP_CORS_ORIGINS: "*"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: tram-forecast-frontend:1.0
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    restart: unless-stopped
