# Горизонтальное масштабирование: N реплик backend (по умолчанию 3) за nginx-балансировщиком lb.
# Запуск:  docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --build --scale backend=3
#          → http://localhost:8081 (UI), http://localhost:8080 (API через балансировщик)
# Реплики не публикуют порт на хост; frontend проксирует /api в lb, lb раскладывает запросы по репликам.
services:
  backend:
    ports: !reset []
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "2"
          memory: 2g

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/lb/health | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 256m
    restart: unless-stopped

  frontend:
    environment:
      BACKEND_URL: http://lb:8080
    depends_on:
      lb:
        condition: service_healthy
