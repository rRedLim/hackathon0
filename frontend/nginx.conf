# Шаблон: envsubst (образ nginx) подставляет ${BACKEND_URL} при старте контейнера.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/csv application/javascript application/json application/problem+json image/svg+xml;

    # Docker DNS: имя backend резолвится при запросе, nginx стартует даже если backend ещё не поднят
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    set $backend ${BACKEND_URL};

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_request_buffering off;

    location /api/ {
        proxy_pass $backend;
    }

    location /actuator/ {
        proxy_pass $backend;
    }

    location /swagger-ui {
        proxy_pass $backend;
    }

    location /v3/api-docs {
        proxy_pass $backend;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
